services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-gms_root_pw}
      MYSQL_DATABASE: ${DB_NAME:-gms_db}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-gms_root_pw}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-gms_root_pw}
      DB_NAME: ${DB_NAME:-gms_db}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      GARAGE_CODE: ${GARAGE_CODE:-ADMIN}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    command: sh -c "npm run migrate && npm start"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mysql_data:
